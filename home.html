<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GUAOLZUT | Home</title>

  <link rel="icon" type="image/png" href="./images/GZ.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(0, 0, 0, .68),
          rgba(0, 0, 0, .82)
        ),
        url("./images/background.gif")
        center center / cover fixed no-repeat;

      color: white;
      font-family: 'Kanit', sans-serif;
    }


    /* =================================
       FALLING GZ LOGO
    ================================= */

    #snow {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 1;
    }


    /* =================================
       HOME
    ================================= */

    .home {
      position: relative;

      z-index: 2;

      width: 100%;
      height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 20px;
    }


    .home-content {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      width: 100%;
    }


    /* =================================
       MAIN LOGO
    ================================= */

    .main-logo {
      width: 190px;
      height: auto;

      display: block;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 8px
          rgba(255,255,255,.7)
        )
        drop-shadow(
          0 0 22px
          rgba(255,255,255,.25)
        );

      transition: .3s;
    }


    .main-logo:hover {
      transform: scale(1.05);

      filter:
        drop-shadow(
          0 0 12px
          rgba(255,255,255,.9)
        )
        drop-shadow(
          0 0 30px
          rgba(255,255,255,.35)
        );
    }


    /* =================================
       TITLE
    ================================= */

    .title {
      margin-top: 20px;

      font-family:
        'Orbitron',
        sans-serif;

      font-size:
        clamp(30px, 6vw, 58px);

      font-weight: 900;

      letter-spacing: 7px;

      color: #fff;

      text-shadow:
        0 0 10px
        rgba(255,255,255,.25),

        0 0 30px
        rgba(255,255,255,.1);
    }


    /* =================================
       SUBTITLE
    ================================= */

    .subtitle {
      margin-top: 7px;

      font-family:
        'Rajdhani',
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      letter-spacing: 8px;

      color: #aaa;
    }


    /* =================================
       BUTTON
    ================================= */

    .home-buttons {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 12px;

      margin-top: 30px;
    }


    .home-button {
      display: inline-flex;

      justify-content: center;
      align-items: center;

      min-width: 160px;

      height: 48px;

      padding: 0 25px;

      color: #fff;

      text-decoration: none;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.4);

      border-radius: 8px;

      backdrop-filter: blur(8px);

      font-family:
        'Orbitron',
        sans-serif;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 1.5px;

      transition: .25s;
    }


    .home-button:hover {
      background:
        rgba(255,255,255,.13);

      border-color: #fff;

      transform:
        translateY(-3px);

      box-shadow:
        0 0 20px
        rgba(255,255,255,.15);
    }


    /* =================================
       FOOTER
    ================================= */

    .footer {
      position: fixed;

      z-index: 3;

      bottom: 15px;

      left: 0;

      width: 100%;

      text-align: center;

      color: #666;

      font-family:
        'Rajdhani',
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;
    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .main-logo {
        width: 145px;
      }

      .title {
        font-size: 30px;
        letter-spacing: 4px;
      }

      .subtitle {
        font-size: 14px;
        letter-spacing: 5px;
      }

      .home-buttons {
        gap: 8px;
      }

      .home-button {
        min-width: 140px;
        height: 45px;

        padding: 0 15px;

        font-size: 10px;
      }

    }

  </style>
</head>


<body>


  <!-- =================================
       FALLING GZ LOGOS
  ================================= -->

  <canvas id="snow"></canvas>


  <!-- =================================
       HOME
  ================================= -->

  <main class="home">

    <div class="home-content">


      <!-- MAIN GZ LOGO -->

      <img
        src="./images/GZ.png"
        alt="GUAOLZUT"
        class="main-logo"
      >


      <!-- TITLE -->

      <h1 class="title">
        GUAOLZUT
      </h1>


      <!-- SUBTITLE -->

      <div class="subtitle">
        WELCOME TO GUAOLZUT
      </div>


      <!-- MEMBER BUTTON -->

      <div class="home-buttons">

        <a
          href="./index.html"
          class="home-button"
        >
          MEMBER
        </a>

      </div>


    </div>

  </main>


  <!-- =================================
       FOOTER
  ================================= -->

  <div class="footer">
    © GUAOLZUT.
  </div>


  <!-- =================================
       FALLING LOGO JAVASCRIPT
       SAME AS INDEX.HTML
  ================================= -->

  <script>

    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d");

    const logo = new Image();

    logo.src = "./images/GZ.png";

    let flakes = [];

    const FLAKE_COUNT = 100;


    /* =================================
       CREATE PARTICLES
    ================================= */

    function createFlakes() {

      flakes = Array.from(
        { length: FLAKE_COUNT },
        () => ({

          x: Math.random() * canvas.width,

          y: Math.random() * canvas.height,

          size: Math.random() * 14 + 16,

          speed: Math.random() * 1.5 + 0.5,

          drift: Math.random() * 1 - 0.5,

          rotation: Math.random() * Math.PI * 2,

          rotationSpeed: Math.random() * 0.02 - 0.01,

          opacity: Math.random() * 0.45 + 0.45

        })
      );

    }


    /* =================================
       RESIZE
    ================================= */

    function resizeSnow() {

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      createFlakes();

    }


    /* =================================
       ANIMATION
    ================================= */

    function animateSnow() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      flakes.forEach(flake => {

        ctx.save();

        ctx.globalAlpha = flake.opacity;

        ctx.translate(
          flake.x,
          flake.y
        );

        ctx.rotate(
          flake.rotation
        );


        ctx.drawImage(
          logo,
          -flake.size / 2,
          -flake.size / 2,
          flake.size,
          flake.size
        );


        ctx.restore();


        /* FALL */

        flake.y += flake.speed;


        /* LEFT / RIGHT */

        flake.x += flake.drift;


        /* ROTATE */

        flake.rotation += flake.rotationSpeed;


        /* RESET */

        if (flake.y > canvas.height + 30) {

          flake.y = -30;

          flake.x =
            Math.random() *
            canvas.width;

        }


        /* RIGHT */

        if (flake.x > canvas.width + 30) {

          flake.x = -30;

        }


        /* LEFT */

        if (flake.x < -30) {

          flake.x =
            canvas.width + 30;

        }

      });


      requestAnimationFrame(
        animateSnow
      );

    }


    /* =================================
       START
    ================================= */

    logo.onload = () => {

      resizeSnow();

      animateSnow();

    };


    window.addEventListener(
      "resize",
      resizeSnow
    );

  </script>


</body>
</html>
